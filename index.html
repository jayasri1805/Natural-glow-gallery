<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpeg"
          href="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="style.css" />
    <title>Nature Glow Gallery</title>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="hero-shell">
          <div class="hero-left">
            <div class="brand-row">
              <span class="brand-name">Curated moments</span>
            </div>

            <div class="title-wrap">
              <h1>Nature Glow</h1>
            </div>
          </div>

          <div class="hero-right">
            <div class="mini-stats">
              <div class="mini-box">
                <small>Shots</small>
                <strong>60</strong>
              </div>
              <div class="mini-box accent">
                <small>Theme</small>
                <strong>Warm</strong>
              </div>
            </div>
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme">
              Night mode
            </button>
          </div>
        </div>
      </header>

      <section class="toolbar" aria-label="Gallery controls">
        <label class="search-box" for="search-input">
          <span>Search</span>
          <input id="search-input" type="search" placeholder="Search images..." />
        </label>

        <div class="filter-btns" id="filter-btn">
          <button class="filter-btn active" data-name="all" type="button">All</button>
          <button class="filter-btn" data-name="sun-rise" type="button">Sunrise</button>
          <button class="filter-btn" data-name="sun-set" type="button">Sunset</button>
          <button class="filter-btn" data-name="moon" type="button">Moon</button>
          <button class="filter-btn" data-name="star" type="button">Stars</button>
        </div>
      </section>

      <div class="gallery-meta">
        <p id="result-count">0 images</p>
        <button id="reset-button" class="reset-button" type="button">Reset view</button>
      </div>

      <main class="gallery" id="gall-img"></main>
    </div>

    <div class="lightbox" id="lightbox" aria-hidden="true">
      <div class="lightbox-inner">
        <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close image view">×</button>
        <img id="lightbox-image" src="" alt="" />
        <div class="lightbox-caption">
          <p id="lightbox-category">Sunrise</p>
          <h3 id="lightbox-title">Golden Horizon</h3>
        </div>
      </div>
    </div>

    <footer class="site-footer">© <span id="year"></span> Nature Glow Gallery. All rights reserved.</footer>

    <script src="script.js"></script>
  </body>
</html>
